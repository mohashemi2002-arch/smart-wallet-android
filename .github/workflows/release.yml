name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x ./gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo 'RELEASE_KEYSTORE_BASE64 is not configured'; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/smart-wallet-release.jks

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: smart-wallet-release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean assembleRelease --no-daemon

      - name: Prepare release APK and metadata
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK_PATH" || { echo 'Release APK not found'; exit 1; }

          cp "$APK_PATH" smart-wallet-release.apk
          SHA256=$(sha256sum smart-wallet-release.apk | awk '{print $1}')
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_CODE" || { echo 'Could not determine versionCode from app/build.gradle.kts'; exit 1; }

          echo "apk_path=smart-wallet-release.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Smart Wallet ${{ steps.metadata.outputs.version_name }}
          generate_release_notes: true
          files: ${{ steps.metadata.outputs.apk_path }}
          body: |
            ## Smart Wallet ${{ steps.metadata.outputs.version_name }}

            **Version code:** `${{ steps.metadata.outputs.version_code }}`

            **SHA-256:** `${{ steps.metadata.outputs.sha256 }}`

            The APK was built and signed automatically by GitHub Actions.

      - name: Update OTA metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/smart-wallet-release.apk"

          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "mandatory": false,
            "minSupportedVersionCode": 1,
            "apkUrl": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}",
            "releaseNotes": [
              "Update to version ${VERSION_NAME}"
            ]
          }
          EOF

      - name: Commit OTA metadata to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          git add update.json
          if git diff --cached --quiet; then
            echo 'update.json is already up to date.'
          else
            git commit -m "chore(ota): update metadata for ${{ steps.metadata.outputs.version_name }} [skip ci]"
            git push origin main
          fi
