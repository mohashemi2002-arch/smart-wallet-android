name: Android OTA Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Restore and Validate Release Keystore
        env:
          OTA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OTA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OTA_RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing GitHub Actions secret OTA_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi

          mkdir -p app/keystore
          printf '%s' "${OTA_RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode > app/keystore/ota_release.jks

          if [[ ! -s app/keystore/ota_release.jks ]]; then
            echo "::error::The decoded keystore is empty or invalid."
            exit 1
          fi

          keytool -list \
            -keystore app/keystore/ota_release.jks \
            -storepass android123 \
            -alias ota_key >/dev/null

          echo "Release keystore restored and validated."

      - name: Bootstrap Gradle Wrapper (9.3.1)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "./gradlew" ]]; then
            echo "gradlew missing. Generating wrapper for Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_OFFSET: '14'
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION_CODE=$((WORKFLOW_RUN_NUMBER + VERSION_CODE_OFFSET))
          echo "RELEASE_VERSION_CODE=${RELEASE_VERSION_CODE}" >> "$GITHUB_ENV"

          GITHUB_RUN_NUMBER="${RELEASE_VERSION_CODE}" \
            ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Prepare APK Asset
        shell: bash
        run: |
          set -euo pipefail

          VERSION_TAG="v1.0.${RELEASE_VERSION_CODE}"
          APK_NAME="SmartWallet-${VERSION_TAG}.apk"

          if [[ ! -d app/build/outputs/apk/release ]]; then
            echo "::error::Gradle did not create the release output directory."
            exit 1
          fi

          SRC_APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [[ -z "${SRC_APK}" ]]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          mkdir -p release_artifacts
          cp "${SRC_APK}" "release_artifacts/${APK_NAME}"

          echo "APK_PATH=release_artifacts/${APK_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"

          echo "Prepared ${APK_NAME} for release ${VERSION_TAG}."

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION_TAG }}
          name: "نسخه جدید Smart Wallet ${{ env.VERSION_TAG }}"
          body: |
            بروزرسانی خودکار اپلیکیشن Smart Wallet (Smart Wallet)
            - نسخه: ${{ env.VERSION_TAG }}
            - versionCode: ${{ env.RELEASE_VERSION_CODE }}
            - شماره اجرای GitHub Actions: ${{ github.run_number }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: ${{ env.APK_PATH }}
