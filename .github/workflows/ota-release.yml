name: Build and Publish OTA Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Prepare Artifact and Calculate Checksum
        id: meta
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi

          FINAL_NAME="app-release.apk"
          cp "\(APK_FILE" "./\)FINAL_NAME"

          # محاسبه هش SHA-256
          HASH=\((sha256sum "./\)FINAL_NAME" | cut -d ' ' -f 1)
          
          # استخراج مشخصات از تگ
          TAG="${GITHUB_REF#refs/tags/}"
          VER_NAME="${TAG#v}"
          
          # استخراج versionCode از گرادل یا استفاده از شماره ساخت به عنوان جایگزین
          VER_CODE=\((grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts 2>/dev/null || echo "\)GITHUB_RUN_NUMBER")

          echo "apk_path=./\(FINAL_NAME" >>\)GITHUB_OUTPUT
          echo "sha256=\(HASH" >>\)GITHUB_OUTPUT
          echo "ver_name=\(VER_NAME" >>\)GITHUB_OUTPUT
          echo "ver_code=\(VER_CODE" >>\)GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: ${{ steps.meta.outputs.apk_path }}
          generate_release_notes: true

      - name: Update update.json in Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull origin main

          DL_URL="https://github.com/\({{ github.repository }}/releases/download/\){{ github.ref_name }}/app-release.apk"

          cat < update.json
          {
            "versionCode": ${{ steps.meta.outputs.ver_code }},
            "versionName": "${{ steps.meta.outputs.ver_name }}",
            "mandatory": false,
            "minSupportedVersionCode": 1,
            "apkUrl": "$DL_URL",
            "sha256": "${{ steps.meta.outputs.sha256 }}",
            "releaseNotes": [
              "Release ${{ steps.meta.outputs.ver_name }}"
            ]
          }
          EOF

          git add update.json
          git commit -m "chore(ota): update to ${{ steps.meta.outputs.ver_name }} [skip ci]" || exit 0
          git push origin main
