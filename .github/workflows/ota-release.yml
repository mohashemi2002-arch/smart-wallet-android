name: Build and Deploy Android OTA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Locate APK and Generate Hashes
        id: prepare_ota
        run: |
          # پیدا کردن فایل نصبی ساخته شده توسط گرادل
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "خطا: هیچ فایل APK یافت نشد!"
            exit 1
          fi

          cp "$APK_FILE" "./app-release.apk"

          # محاسبه هش SHA-256 جهت امنیت
          SHA256_HASH=$(sha256sum "./app-release.apk" | awk '{print $1}')

          # استخراج نام و کد نسخه
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          
          VERSION_CODE=\((grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts 2>/dev/null || grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle 2>/dev/null || echo "\)GITHUB_RUN_NUMBER")

          echo "apk_path=./app-release.apk" >> $GITHUB_OUTPUT
          echo "sha256=\(SHA256_HASH" >>\)GITHUB_OUTPUT
          echo "version_name=\(VERSION_NAME" >>\)GITHUB_OUTPUT
          echo "version_code=\(VERSION_CODE" >>\)GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.prepare_ota.outputs.version_name }}
          files: ${{ steps.prepare_ota.outputs.apk_path }}
          generate_release_notes: true

      - name: Update update.json in Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull origin main

          DOWNLOAD_URL="https://github.com/\({{ github.repository }}/releases/download/\){{ github.ref_name }}/app-release.apk"

          cat < update.json
          {
            "versionCode": ${{ steps.prepare_ota.outputs.version_code }},
            "versionName": "${{ steps.prepare_ota.outputs.version_name }}",
            "mandatory": false,
            "minSupportedVersionCode": 1,
            "apkUrl": "$DOWNLOAD_URL",
            "sha256": "${{ steps.prepare_ota.outputs.sha256 }}",
            "releaseNotes": [
              "آپدیت به نسخه ${{ steps.prepare_ota.outputs.version_name }}"
            ]
          }
          EOF

          git add update.json
          git commit -m "chore(ota): bump update.json to ${{ steps.prepare_ota.outputs.version_name }} [skip ci]" || exit 0
          git push origin main
