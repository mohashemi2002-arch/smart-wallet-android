name: Build and Deploy OTA Update

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Process APK and Calculate SHA-256
        id: prep
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"

          # پیدا کردن فایل نصبی خروجی گرادل
          APK_PATH=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi

          cp "$APK_PATH" "./app-release.apk"

          # محاسبه هش SHA-256 برای بررسی اصالت در گوشی
          SHA256_SUM=$(sha256sum "./app-release.apk" | awk '{print $1}')

          # استخراج versionCode از گرادل یا شماره ساخت
          VERSION_CODE=\((grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts 2>/dev/null || echo "\)GITHUB_RUN_NUMBER")

          echo "apk_path=./app-release.apk" >> $GITHUB_OUTPUT
          echo "sha256=\(SHA256_SUM" >>\)GITHUB_OUTPUT
          echo "version_name=\(VERSION_NAME" >>\)GITHUB_OUTPUT
          echo "version_code=\(VERSION_CODE" >>\)GITHUB_OUTPUT

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ steps.prep.outputs.version_name }}
          files: ${{ steps.prep.outputs.apk_path }}
          generate_release_notes: true

      - name: Update update.json in main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main
          git pull origin main

          APK_URL="https://github.com/\({{ github.repository }}/releases/download/\){{ github.ref_name }}/app-release.apk"

          cat < update.json
          {
            "versionCode": ${{ steps.prep.outputs.version_code }},
            "versionName": "${{ steps.prep.outputs.version_name }}",
            "mandatory": false,
            "minSupportedVersionCode": 1,
            "apkUrl": "$APK_URL",
            "sha256": "${{ steps.prep.outputs.sha256 }}",
            "releaseNotes": [
              "نسخه جدید ${{ steps.prep.outputs.version_name }}"
            ]
          }
          EOF

          git add update.json
          git commit -m "chore(ota): bump update.json to ${{ steps.prep.outputs.version_name }} [skip ci]" || exit 0
          git push origin main
